name: Compilar GR33N PS3

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar GR33N
        uses: actions/checkout@v4

      - name: Instalar herramientas y SDK completo de PS3
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config curl wget git libelf-dev zlib1g-dev libssl-dev libgmp-dev libmpfr-dev libmpc-dev python3
          sudo mkdir -p /usr/local/ps3dev /tmp/ps3extract
          sudo chmod -R 777 /usr/local/ps3dev /tmp/ps3extract
          URL=$(curl -s https://github.com | grep "browser_download_url" | grep -i "linux" | head -n 1 | cut -d '"' -f 4)
          if [ -z "$URL" ]; then
            URL=$(curl -s https://github.com | grep "browser_download_url" | grep -i "linux" | head -n 1 | cut -d '"' -f 4)
          fi
          curl -L "$URL" -o /tmp/ps3dev.tar.gz
          tar -xzf /tmp/ps3dev.tar.gz -C /tmp/ps3extract
          if [ -d "/tmp/ps3extract/usr/local/ps3dev" ]; then
            cp -rn /tmp/ps3extract/usr/local/ps3dev/* /usr/local/ps3dev/
          elif [ -d "/tmp/ps3extract/ps3dev" ]; then
            cp -rn /tmp/ps3extract/ps3dev/* /usr/local/ps3dev/
          else
            cp -rn /tmp/ps3extract/* /usr/local/ps3dev/
          fi

      - name: Compilar dependencias en orden
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          sh deps/build-mbedtls.sh
          sh deps/build-libsrtp.sh
          sh deps/build-usrsctp.sh
          sh deps/build-libpeer.sh
          sh deps/build-opus.sh

      - name: Compilar GR33N y empaquetar PKG
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          make
          make pkg

      - name: Subir GR33N.pkg
        uses: actions/upload-artifact@v4
        with:
          name: gr33n-pkg
          path: "*.pkg"
          
